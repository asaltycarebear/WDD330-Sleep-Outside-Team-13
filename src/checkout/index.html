<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider checkout">
      <h2>Review &amp; Place your Order</h2>
      <section class="checkout-form">
        <form name="checkout">
          <fieldset>
            <legend>Shipping</legend>
            <label for="fname">First Name</label>
            <input id="fname" name="fname" type="text" required autocomplete="given-name" />

            <label for="lname">Last Name</label>
            <input id="lname" name="lname" type="text" required autocomplete="family-name" />

            <label for="street">Street</label>
            <input id="street" name="street" type="text" required autocomplete="street-address" />

            <label for="city">City</label>
            <input id="city" name="city" type="text" required autocomplete="address-level2" />

            <label for="state">State</label>
            <input id="state" name="state" type="text" required autocomplete="address-level1" />

            <label for="zip">Zip</label>
            <input id="zip" name="zip" type="text" required inputmode="numeric" pattern="[0-9]{5}(-[0-9]{4})?" autocomplete="postal-code" />
          </fieldset>

          <fieldset>
            <legend>Payment</legend>
            <label for="cardNumber">Card Number</label>
            <input id="cardNumber" name="cardNumber" type="text" required inputmode="numeric" pattern="[0-9]{16}" placeholder="1234123412341234" autocomplete="cc-number" />

            <label for="expiration">Expiration</label>
            <input id="expiration" name="expiration" type="text" required placeholder="MM/YY" pattern="^(0[1-9]|1[0-2])\/([0-9]{2})$" autocomplete="cc-exp" />

            <label for="code">Security Code</label>
            <input id="code" name="code" type="text" required inputmode="numeric" pattern="[0-9]{3,4}" placeholder="123" autocomplete="cc-csc" />
          </fieldset>

          <fieldset class="checkout-summary">
            <legend>Order Summary</legend>
            <ul>
              <li>
                <label>Item Subtotal (<span id="num-items">0</span>)</label>
                <p id="cartTotal">$0.00</p>
              </li>
              <li>
                <label>Shipping Estimate</label>
                <p id="shipping">$0.00</p>
              </li>
              <li>
                <label>Tax</label>
                <p id="tax">$0.00</p>
              </li>
              <li>
                <label><b>Order Total</b></label>
                <p id="orderTotal"><b>$0.00</b></p>
              </li>
            </ul>
          </fieldset>

          <button id="checkoutSubmit" type="submit">Checkout</button>
        </form>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
